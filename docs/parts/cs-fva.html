<article class="cs"><h3><a href="fva.html">Forward volatility agreements</a></h3><div class="f left">σ<sub>f</sub>² = (σ<sub>2</sub>²T<sub>2</sub> − σ<sub>1</sub>²T<sub>1</sub>) / (T<sub>2</sub> − T<sub>1</sub>)<br>Straddle(σ) = 2FD·[2N(½σ√τ) − 1] ≈ 0.8·σ√τ·F·D<br>PV = N·[Straddle(σ<sub>f</sub>) − Straddle(K<sub>vol</sub>)]</div><p><b>Greeks:</b> forward vega (long σ<sub>2</sub>, short σ<sub>1</sub>), almost no delta or gamma before the strike date, vol-of-vol convexity.</p></article>
