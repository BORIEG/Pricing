<article class="cs"><h3><a href="futures.html">Futures: the basics</a></h3><div class="f left">PV = (<var>F</var><sub>now</sub> − <var>F</var><sub>trade</sub>) × <var>M</var> × <var>n</var> &nbsp;(no discounting, settled daily)<br><var>F</var> = <var>S</var> e<sup>(<var>r</var> − <var>q</var> + <var>u</var> − <var>y</var>)<var>T</var></sup> &nbsp;· FX: <var>F</var> = <var>S</var> e<sup>(<var>r</var><sub>d</sub>−<var>r</var><sub>f</sub>)<var>T</var></sup> &nbsp;· stock: (<var>S</var> − PV(divs)) e<sup><var>rT</var></sup></div><p><b>Greeks:</b> delta = <var>M</var> × <var>n</var> per point; small rho and dividend/carry sensitivity; no gamma or vega.</p></article>
